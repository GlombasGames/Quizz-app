services:
  traefik:
    command:
      - --api.dashboard=false
      - --ping=true
      - --ping.entrypoint=traefik
      - --entrypoints.traefik.address=:8082
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=game-panel-edge
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
  triviantis-backend:
    labels:
      - traefik.http.routers.triviantis-api.tls.certresolver=letsencrypt

  triviantis-web:
    labels:
      - traefik.http.routers.triviantis-web.tls.certresolver=letsencrypt
      - traefik.http.routers.triviantis-www.tls.certresolver=letsencrypt

  huertero:
    labels:
      - traefik.http.routers.huertero-api.tls.certresolver=letsencrypt

  huertero-images:
    labels:
      - traefik.http.routers.huertero-images.tls.certresolver=letsencrypt
