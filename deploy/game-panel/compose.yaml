name: game-panel

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik@sha256:f79c88ed5252ae1e31c757a9796d751461ddb502437b8d8526db9e12605a82eb}
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.40"
    command:
      - --api.dashboard=false
      - --ping=true
      - --ping.entrypoint=traefik
      - --entrypoints.traefik.address=:8082
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=game-panel-edge
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --providers.file.watch=true
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
    ports:
      - "${TRAEFIK_HTTP_BIND:-127.0.0.1:18080}:80"
      - "${TRAEFIK_HTTPS_BIND:-127.0.0.1:18443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /opt/game-panel-data/traefik:/letsencrypt
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--entrypoints.traefik.address=:8082", "--ping.entrypoint=traefik"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  mongo:
    image: ${MONGO_IMAGE:-mongo@sha256:41e8195b2791692695e1dc9bd21cd51d0a3af05fff8ace9304a5c1acf94f1ae1}
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - /opt/game-panel-data/mongo:/data/db
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ping:1}).ok ? 0 : 2)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  triviantis-backend:
    image: game-panel/triviantis-backend:${TRIVIANTIS_IMAGE_TAG:?Set TRIVIANTIS_IMAGE_TAG}
    build:
      context: ${TRIVIANTIS_SOURCE_DIR:-../..}
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3100"
      MONGODB_URI: mongodb://mongo:27017
    volumes:
      - /opt/game-panel-data/triviantis/firebase-admin-config.json:/app/backend/firebase-admin-config.json:ro
      - /opt/game-panel-data/triviantis/tokens.json:/app/backend/tokens.json
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - edge
      - internal
    labels:
      - traefik.enable=true
      - traefik.docker.network=game-panel-edge
      - traefik.http.routers.triviantis-api.rule=Host(`triviantis.com`) && PathPrefix(`/api`)
      - traefik.http.routers.triviantis-api.priority=100
      - traefik.http.routers.triviantis-api.entrypoints=websecure
      - traefik.http.routers.triviantis-api.tls=true
      - traefik.http.routers.triviantis-api.service=triviantis-api
      - traefik.http.services.triviantis-api.loadbalancer.server.port=3100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/api/ping').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  triviantis-web:
    image: game-panel/triviantis-web:${TRIVIANTIS_IMAGE_TAG:?Set TRIVIANTIS_IMAGE_TAG}
    build:
      context: ${TRIVIANTIS_SOURCE_DIR:-../..}
      dockerfile: Dockerfile.web
    restart: unless-stopped
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=game-panel-edge
      - traefik.http.routers.triviantis-web.rule=Host(`triviantis.com`)
      - traefik.http.routers.triviantis-web.entrypoints=websecure
      - traefik.http.routers.triviantis-web.tls=true
      - traefik.http.routers.triviantis-web.service=triviantis-web
      - traefik.http.routers.triviantis-www.rule=Host(`www.triviantis.com`)
      - traefik.http.routers.triviantis-www.entrypoints=websecure
      - traefik.http.routers.triviantis-www.tls=true
      - traefik.http.routers.triviantis-www.middlewares=triviantis-www-redirect
      - traefik.http.middlewares.triviantis-www-redirect.redirectregex.regex=^https?://www\.triviantis\.com(:[0-9]+)?/(.*)
      - traefik.http.middlewares.triviantis-www-redirect.redirectregex.replacement=https://triviantis.com/$${2}
      - traefik.http.middlewares.triviantis-www-redirect.redirectregex.permanent=true
      - traefik.http.services.triviantis-web.loadbalancer.server.port=80

  huertero:
    image: game-panel/huertero:${HUERTERO_IMAGE_TAG:?Set HUERTERO_IMAGE_TAG}
    build:
      context: ${HUERTERO_SOURCE_DIR:?Set HUERTERO_SOURCE_DIR}
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/game-panel-data/huertero/huertero.env
    environment:
      NODE_ENV: production
      PORT: "3030"
      FCM_SERVICE_ACCOUNT_PATH: /run/secrets/huertero-firebase-admin.json
    ports:
      - "${HUERTERO_DIRECT_BIND:-0.0.0.0:3030}:3030"
    volumes:
      - /opt/game-panel-data/huertero/data:/app/data
      - /opt/game-panel-data/huertero/content:/app/content
      - /opt/game-panel-data/huertero/serviceAccount.json:/run/secrets/huertero-firebase-admin.json:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=game-panel-edge
      - traefik.http.routers.huertero-api.rule=Host(`api.triviantis.com`)
      - traefik.http.routers.huertero-api.entrypoints=websecure
      - traefik.http.routers.huertero-api.tls=true
      - traefik.http.routers.huertero-api.service=huertero-api
      - traefik.http.services.huertero-api.loadbalancer.server.port=3030
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3030/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  huertero-images:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    volumes:
      - /opt/game-panel-data/huertero/content/images:/srv/images:ro
      - ./nginx-images.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edge
    labels:
      - traefik.enable=true
      - traefik.docker.network=game-panel-edge
      - traefik.http.routers.huertero-images.rule=Host(`img.triviantis.com`)
      - traefik.http.routers.huertero-images.entrypoints=websecure
      - traefik.http.routers.huertero-images.tls=true
      - traefik.http.routers.huertero-images.service=huertero-images
      - traefik.http.services.huertero-images.loadbalancer.server.port=80

networks:
  edge:
    name: game-panel-edge
  internal:
    name: game-panel-internal
    internal: true
