server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(selva|mitologia|ciencia|peliculas)$ {
        return 301 /$1/;
    }

    location ~ ^/(selva|mitologia|ciencia|peliculas)/$ {
        try_files /$1/index.html =404;
    }
}
