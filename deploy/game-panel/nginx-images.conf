server {
    listen 80;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "Huertero image service\n";
    }

    location /content/images/ {
        alias /srv/images/;
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public";
    }
}
